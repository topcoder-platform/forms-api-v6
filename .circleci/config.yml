version: 2.1

executors:
  build:
    docker:
      - image: cimg/python:3.13.2-browsers
    resource_class: medium

commands:
  install-dependencies:
    steps:
      - run:
          name: Install build and deployment dependencies
          command: |
            sudo apt-get update -qq
            sudo apt-get install -y -qq jq python3-pip
            pip install boto3 awscli

jobs:
  deploy:
    executor: build
    parameters:
      deploy_env:
        type: enum
        enum: [DEV, PROD]
      environment:
        type: enum
        enum: [dev, production]
    environment:
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      AWS_STS_REGIONAL_ENDPOINTS: regional
      APPNAME: forms-api-v6
    steps:
      - checkout
      - setup_remote_docker
      - install-dependencies
      - run:
          name: Verify first-release activation and rollback handling
          command: python3 -m unittest discover -s deploy/tests
      - run:
          name: Build runtime and one-shot migration images
          command: |
            docker buildx build --load --target migrate -t forms-api-v6:migrate-candidate .
            docker buildx build --load --target runtime -t forms-api-v6:latest .
      - run:
          name: Migrate and deploy using the Topcoder deployment suite
          no_output_timeout: 35m
          command: |
            git clone --quiet --depth 1 --branch v1.4.20 https://github.com/topcoder-platform/tc-deploy-scripts ../buildscript
            test "$(git -C ../buildscript rev-parse HEAD)" = 5f3745c35463ce0e2475c12269aa7a2b446456e5
            cp ../buildscript/{master_deploy,buildenv,awsconfiguration,psvar-processor}.sh .
            ./awsconfiguration.sh << parameters.deploy_env >>
            set +x
            source awsenvconf
            ./psvar-processor.sh -t appenv -p "/config/${APPNAME}/deployvar"
            source deployvar_env
            python3 -u deploy/release.py << parameters.environment >> "<< parameters.environment >>-${CIRCLE_SHA1}-${CIRCLE_BUILD_NUM}"
            ./master_deploy.sh \
              -d ECS \
              -e << parameters.deploy_env >> \
              -t latest \
              -j "/config/${APPNAME}/appvar,/config/common/global-appvar" \
              -i "$APPNAME" \
              -p FARGATE
            python3 -u deploy/activate.py
      - store_artifacts:
          path: deploy/release-<< parameters.environment >>.json
          destination: release

workflows:
  build-and-deploy:
    jobs:
      - deploy:
          name: deploy-dev
          context: org-global
          deploy_env: DEV
          environment: dev
          serial-group: << pipeline.project.slug >>/deploy-dev
          filters:
            branches:
              only: develop
      - deploy:
          name: deploy-production
          context: org-global
          deploy_env: PROD
          environment: production
          serial-group: << pipeline.project.slug >>/deploy-production
          filters:
            branches:
              only: master
