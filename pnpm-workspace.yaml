allowBuilds:
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  prisma: true
  '@scarf/scarf': false
  dtrace-provider: false
# The shared Bus API wrapper depends on Topcoder's Git-hosted core library.
blockExoticSubdeps: false

overrides:
  body-parser@^2: 2.4.0
  proxy-addr: 2.0.8
  qs: 6.16.1
  multer: 2.5.0
  deepmerge-ts: 8.0.2
  js-yaml@^3: 3.15.2
  js-yaml@^4: 4.3.2
  js-yaml@^5: 5.5.0
  undici@^7: 7.30.1
  undici@^8: 8.12.3
  fast-uri: 3.1.9
  brace-expansion@^1: 1.1.21
  brace-expansion@^2: 2.1.7
  brace-expansion@>=3: 5.0.12
  source-map-js: 1.2.2
  minimatch@<9: file:tools/minimatch-compat
  minimatch@>=9: 11.0.1
  glob@>=9: 14.0.2
  vite: 7.3.7
  mysql2: 3.23.1
